name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Aculyre is a prototype with no plug-in yet, so there is no plugin-macos job,
# no package and no main-build or release workflow: every job builds the
# JUCE-free engine. Linux runs the unit, audio and perf tiers, macOS and
# Windows the unit tier, and the sanitizer job the unit and fuzz tiers.
jobs:
  dsp-tests:
    name: DSP unit, audio and perf tiers, Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      # The Python checks and the demo phrases use only the standard library.
      - name: Set up Python for the demo-source check
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ACULYRE_REQUIRE_PYTHON_TESTS fails the configuration rather than
      # leaving Aculyre.DemoMidiSources out when Python is missing.
      - name: Configure
        run: >-
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DACULYRE_REQUIRE_PYTHON_TESTS=ON
          "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"

      # The default build includes AculyreDSPCxx17, the Rack toolchain's C++17 check.
      - name: Build
        run: cmake --build build-dsp --parallel

      - name: Unit tier
        run: ctest --test-dir build-dsp -L '^unit$' --no-tests=error --output-on-failure

      - name: Audio tier
        run: ctest --test-dir build-dsp -L '^audio$' --no-tests=error --output-on-failure

      # Aculyre.CpuBudget: the demos' realtime factor against the budget in
      # Tools/RenderPresetDemos.cpp; a worst block above 10% only warns (U12).
      # Verbose, so the run's log carries the figures the budget is set from.
      - name: Perf tier
        run: ctest --test-dir build-dsp -L '^perf$' --no-tests=error -V

      - name: Render the demos for review
        run: |
          ./build-dsp/RenderAculyrePresetDemos --jobs 4 Docs/audio/midi build-dsp/demo-audio
          ./build-dsp/RenderAculyrePresetDemos --more --jobs 4 Docs/audio/midi/more build-dsp/demo-audio/more
          sh Tools/render_demo_set.sh build-dsp build-dsp/demo-audio/listening-set

      - name: Upload demo audio and CPU figures
        uses: actions/upload-artifact@v4
        with:
          name: ci-audio-aculyre-build-${{ github.run_number }}
          path: |
            build-dsp/demo-audio/**/*.wav
            build-dsp/cpu.json
          if-no-files-found: error
          retention-days: 7

  dsp-tests-macos:
    name: DSP unit tier, macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for the demo-source check
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure, build and run the unit tier
        run: |
          cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DACULYRE_REQUIRE_PYTHON_TESTS=ON "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
          cmake --build build-dsp --parallel
          ctest --test-dir build-dsp -L '^unit$' --no-tests=error --output-on-failure

  dsp-tests-windows:
    name: DSP unit tier, Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for the demo-source check
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: |
          cmake -S "." -B "build-win" -A x64 -DBUILD_TESTING=ON -DACULYRE_REQUIRE_PYTHON_TESTS=ON "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"

      - name: Build and run the unit tier
        run: |
          cmake --build "build-win" --config Release --parallel
          ctest --test-dir "build-win" -C Release -L "^unit$" --no-tests=error --output-on-failure

  # ACULYRE_ENABLE_SANITIZERS instruments the whole build with the standard's
  # flags (U10); ACULYRE_BUILD_FUZZER adds the libFuzzer target and its
  # time-boxed fuzz-tier run, Aculyre.DspFuzz.
  sanitizers:
    name: Unit and fuzz tiers under ASan + UBSan, Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Clang's sanitizer and libFuzzer runtimes ship in libclang-rt-18-dev.
      - name: Install Ninja and Clang's runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libclang-rt-18-dev

      - name: Set up Python for the demo-source check
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure the instrumented DSP, tests and libFuzzer target
        run: >-
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DACULYRE_ENABLE_SANITIZERS=ON -DACULYRE_BUILD_FUZZER=ON -DBUILD_TESTING=ON
          -DACULYRE_REQUIRE_PYTHON_TESTS=ON
          "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"

      - name: Build
        run: cmake --build build-san --parallel

      - name: Unit tier
        run: ctest --test-dir build-san -L '^unit$' --no-tests=error --output-on-failure

      - name: Fuzz tier
        run: ctest --test-dir build-san -L '^fuzz$' --no-tests=error --output-on-failure

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers-aculyre-${{ github.run_number }}
          path: build-san/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 7
